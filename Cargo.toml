[package]
name = "rs-sqlite2cel2jsons"
version = "0.1.0"
edition = "2024"

description = "Convert SQLite rows to JSONs using CEL"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-sqlite2cel2jsons"
homepage = "https://github.com/takanoriyanagitani/rs-sqlite2cel2jsons"
documentation = "https://docs.rs/rs-sqlite2cel2jsons/latest"
keywords = ["sqlite", "cel", "json", "convert", "wasi"]

exclude = [
  "sqlite2cel2jsons.wasm",
  "example.sqlite.db3",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "sqlite2cel2jsons"

[dependencies.rusqlite]
version = "0.41.0"
default-features = false
features = [
    "bundled",
    "wasm32-wasi-vfs",
]

[dependencies.serde_json]
version = "1"
default-features = false
features = [
  "std",
]

[dependencies.serde]
version = "1"
default-features = false
features = [
  "std",
  "derive",
]

[dependencies.cel]
version = "0.15.0"
default-features = false
features = [
  "ext_encoders",
  "regex",
  "chrono",
  "json",
]
